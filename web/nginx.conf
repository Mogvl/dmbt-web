# nginx config for the dmbt-web frontend container.
#
# The SPA and the API share one origin, exactly like the original AnimeGarden
# web app: browser navigations carry `Accept: text/html` and must get the
# SPA (index.html), while API fetches (Accept: */* or application/json) are
# proxied to the server service. API paths are proxied with the same
# Accept-header rule used by the Vite dev/preview proxy.

map $http_accept $is_html {
    default 0;
    ~*text/html 1;
}

upstream dmbt_server {
    server dmbt-server:9701;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # static assets with long cache
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API paths: proxy unless the request is a browser navigation
    location ~ ^/(resources|resource|detail|subjects|users|teams|collection|sitemaps|health|bgmx|subject|calendar)(/|$) {
        if ($is_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://dmbt_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS feed (same Accept-header rule)
    location ~ ^/feed\.xml(/|$) {
        if ($is_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://dmbt_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback + static files (robots.txt, sitemap-*, openapi.json,
    # llms.txt, .well-known/*)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
